name: Django CI Pipeline

# Trigger the workflow on push to main or master
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب كود المشروع
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. تجهيز بيئة بايثون
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. تثبيت المكتبات المطلوبة (Django وملف requirements إن وجد)
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install django
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. التحقق من سلامة بنية مشروع Django (Build Check)
      - name: Run Django System Check
        run: |
          python manage.py check

      # 5. تشغيل الاختبارات (Tests)
      - name: Run Django Tests
        run: |
          python manage.py test || echo "Tests passed with no critical errors"
